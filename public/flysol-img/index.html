<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flysol Technologies Gallery</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            margin: 0;
            padding: 40px 20px;
        }
        .header {
            max-width: 1200px;
            margin: 0 auto 40px auto;
            text-align: center;
        }
        h1 {
            color: #ffffff;
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .subtitle {
            color: #8b949e;
            font-size: 16px;
            margin-bottom: 24px;
        }
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #58a6ff;
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            padding: 8px 16px;
            border-radius: 6px;
            border: 1px solid rgba(88, 166, 255, 0.2);
            background: rgba(88, 166, 255, 0.1);
            transition: all 0.2s;
        }
        .back-btn:hover {
            background: rgba(88, 166, 255, 0.2);
            text-decoration: none;
        }
        
        /* Responsive Grid Layout */
        .gallery-container {
            max-width: 1400px;
            margin: 0 auto;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 32px;
        }
        .grid-item {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
            cursor: pointer;
            background: #161b22;
        }
        .grid-item:hover {
            transform: translateY(-6px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.6);
            border-color: rgba(88, 166, 255, 0.5);
        }
        .grid-item img {
            width: 100%;
            height: auto;
            object-fit: cover;
            display: block;
            transition: opacity 0.3s;
        }
        .grid-item:hover img {
            opacity: 0.9;
        }

        /* Lightbox (Modal) */
        .lightbox {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
            backdrop-filter: blur(8px);
        }
        .lightbox.active {
            display: flex;
            opacity: 1;
        }
        .lightbox img {
            max-height: 90vh;
            max-width: 95vw;
            border-radius: 8px;
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
            border: 1px solid rgba(255,255,255,0.1);
            object-fit: contain;
        }
        .close-btn {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 40px;
            cursor: pointer;
            line-height: 1;
            opacity: 0.7;
            transition: opacity 0.2s;
        }
        .close-btn:hover {
            opacity: 1;
        }
        
        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
                gap: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <a href="/" class="back-btn">&larr; Back to Portfolio</a>
        <h1 style="margin-top: 30px;">Flysol Technologies Screenshots</h1>
        <p class="subtitle">Click any image to view in full size</p>
    </div>

    <div class="gallery-container">
        <div class="grid">
            <div class="grid-item" onclick="openLightbox('./1.png')"><img src="./1.png" alt="Screenshot 1" loading="lazy"></div>
            <div class="grid-item" onclick="openLightbox('./2.png')"><img src="./2.png" alt="Screenshot 2" loading="lazy"></div>
            <div class="grid-item" onclick="openLightbox('./3.png')"><img src="./3.png" alt="Screenshot 3" loading="lazy"></div>
            <div class="grid-item" onclick="openLightbox('./4.png')"><img src="./4.png" alt="Screenshot 4" loading="lazy"></div>
            <div class="grid-item" onclick="openLightbox('./5.png')"><img src="./5.png" alt="Screenshot 5" loading="lazy"></div>
            <div class="grid-item" onclick="openLightbox('./6.png')"><img src="./6.png" alt="Screenshot 6" loading="lazy"></div>
            <div class="grid-item" onclick="openLightbox('./7.png')"><img src="./7.png" alt="Screenshot 7" loading="lazy"></div>
            <div class="grid-item" onclick="openLightbox('./8.png')"><img src="./8.png" alt="Screenshot 8" loading="lazy"></div>
            <div class="grid-item" onclick="openLightbox('./9.png')"><img src="./9.png" alt="Screenshot 9" loading="lazy"></div>
            <div class="grid-item" onclick="openLightbox('./10.png')"><img src="./10.png" alt="Screenshot 10" loading="lazy"></div>
        </div>
    </div>

    <div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
        <span class="close-btn">&times;</span>
        <img id="lightbox-img" src="" alt="Full size preview">
    </div>

    <script>
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');

        function openLightbox(src) {
            lightboxImg.src = src;
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden'; 
        }

        function closeLightbox(e) {
            if (e.target === lightbox || e.target.classList.contains('close-btn')) {
                lightbox.classList.remove('active');
                document.body.style.overflow = 'auto'; 
            }
        }
        
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && lightbox.classList.contains('active')) {
                lightbox.classList.remove('active');
                document.body.style.overflow = 'auto';
            }
        });
    </script>
</body>
</html>
