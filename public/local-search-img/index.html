<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Search - Mobility Platform Gallery</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0d1117;
            color: white;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            margin-bottom: 40px;
            text-align: center;
            font-size: 32px;
            font-weight: 600;
        }
        .gallery {
            display: flex;
            flex-direction: column;
            gap: 40px;
            max-width: 800px;
            width: 100%;
        }
        .gallery img {
            width: 100%;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .back-btn {
            margin-bottom: 30px;
            color: #58a6ff;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 16px;
            font-weight: 500;
        }
        .back-btn:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <a href="/" class="back-btn">&larr; Back to Portfolio</a>
    <h1>Local Search - Mobility Platform</h1>
    <div class="gallery">
        <img src="./1.jpeg" alt="Screenshot 1">
        <img src="./2.jpeg" alt="Screenshot 2">
        <img src="./3.jpeg" alt="Screenshot 3">
        <img src="./4.jpeg" alt="Screenshot 4">
        <img src="./5.jpeg" alt="Screenshot 5">
        <img src="./6.jpeg" alt="Screenshot 6">
        <img src="./7.jpeg" alt="Screenshot 7">
        <img src="./8.jpeg" alt="Screenshot 8">
        <img src="./9.jpeg" alt="Screenshot 9">
        <img src="./10.jpeg" alt="Screenshot 10">
    </div>
</body>
</html>
